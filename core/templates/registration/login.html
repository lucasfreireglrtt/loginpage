<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Django</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h1 class="text-2xl font-bold mb-6 text-center text-gray-800">Acesse sua Conta</h1>
        
        {% if form.errors %}
            <div class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-4 text-sm">
                Usuário ou senha incorretos!
            </div>
        {% endif %}

        <form method="post" class="space-y-4">
            {% csrf_token %}
            
            <div class="form-style">
                {{ form.as_p }}
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-md transition duration-200">
                Entrar
            </button>
        </form>

        <div class="mt-6 border-t pt-4 text-center">
            <p class="text-sm text-gray-600">
                Não tem uma conta? 
                <a href="{% url 'register' %}" class="text-indigo-600 hover:underline font-medium">Cadastre-se aqui</a>
            </p>
        </div>
    </div>

    <style>
        .form-style p { margin-bottom: 1rem; }
        .form-style label { display: block; font-size: 0.875rem; font-weight: 500; color: #374151; margin-bottom: 0.25rem; }
        .form-style input { 
            width: 100%; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 0.375rem;
            outline: none;
        }
        .form-style input:focus { border-color: #4f46e5; }
    </style>
</body>
</html>
