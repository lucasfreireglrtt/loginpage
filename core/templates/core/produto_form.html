<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Produto - Estoque</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md border border-gray-100">
        <div class="flex items-center space-x-3 mb-6">
            <div class="bg-indigo-600 text-white p-2 rounded-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="12 4v16m8-8H4" />
                </svg>
            </div>
            <h2 class="text-xl font-bold text-gray-800">Novo Produto</h2>
        </div>
        
        <form method="post" class="space-y-5">
            {% csrf_token %}
            
            <div class="form-style">
                {{ form.as_p }}
            </div>

            <div class="flex flex-col space-y-3 pt-2">
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 px-4 rounded-lg shadow transition duration-200">
                    Salvar Produto
                </button>
                
                <a href="{% url 'home' %}" class="w-full text-center text-sm text-gray-500 hover:text-gray-700 font-medium py-2">
                    Cancelar e Voltar
                </a>
            </div>
        </form>
    </div>

    <style>
        .form-style p { margin-bottom: 1.25rem; }
        .form-style label { 
            display: block; 
            font-size: 0.875rem; 
            font-weight: 600; 
            color: #4b5563; 
            margin-bottom: 0.5rem; 
        }
        .form-style input { 
            width: 100%; 
            padding: 0.625rem; 
            border: 1px solid #d1d5db; 
            border-radius: 0.5rem;
            outline: none;
            transition: all 0.2s;
        }
        .form-style input:focus { 
            border-color: #4f46e5; 
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
    </style>
</body>
</html>
